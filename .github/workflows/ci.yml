name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and integration tests (SQLite)
        run: pytest -o addopts="" -q
      - name: First-launch smoke test (seed + end-of-day batch)
        run: python scripts/run_eod.py --no-reports

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: risk_engine
          POSTGRES_USER: risk
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U risk -d risk_engine"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://risk:ci_only@localhost:5432/risk_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-postgres.txt
      - name: Seeding, repository and end-of-day batch against PostgreSQL
        run: pytest -o addopts="" -q tests/test_postgres.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t risk-engine:ci .
      - name: Dashboard starts and reports healthy (SQLite, first-launch seeding)
        run: |
          docker run -d --name risk-engine -p 8501:8501 risk-engine:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health > /dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs risk-engine
          exit 1
      - name: End-of-day batch runs inside the image
        run: docker run --rm risk-engine:ci python scripts/run_eod.py --no-reports
